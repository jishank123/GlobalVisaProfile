<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 200px; }
    </style>
</head>
<body>
    <h1>Authentication Test Page</h1>
    
    <div class="test-section">
        <h2>1. Test Registration</h2>
        <input type="text" id="reg-name" placeholder="Full Name" value="Test User">
        <input type="email" id="reg-email" placeholder="Email" value="test@example.com">
        <input type="tel" id="reg-phone" placeholder="Phone" value="+1234567890">
        <input type="password" id="reg-password" placeholder="Password" value="TestPass123">
        <button onclick="testRegistration()">Register</button>
        <div id="reg-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Test Login</h2>
        <input type="email" id="login-email" placeholder="Email" value="test@example.com">
        <input type="password" id="login-password" placeholder="Password" value="TestPass123">
        <button onclick="testLogin()">Login</button>
        <div id="login-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Test Authentication Status</h2>
        <button onclick="checkAuthStatus()">Check Auth Status</button>
        <div id="auth-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>4. Test Logout</h2>
        <button onclick="testLogout()">Logout</button>
        <div id="logout-result" class="result"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    
    <script>
        function showResult(elementId, message, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.innerHTML = message;
            element.className = `result ${isSuccess ? 'success' : 'error'}`;
        }
        
        async function testRegistration() {
            try {
                const data = {
                    full_name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    phone: document.getElementById('reg-phone').value,
                    password: document.getElementById('reg-password').value
                };
                
                console.log('Testing registration with:', data);
                const response = await ClientAccountsAPI.register(data);
                console.log('Registration response:', response);
                
                showResult('reg-result', `Registration successful! Token: ${response.data?.token ? 'YES' : 'NO'}`, true);
            } catch (error) {
                console.error('Registration error:', error);
                showResult('reg-result', `Registration failed: ${error.message}`, false);
            }
        }
        
        async function testLogin() {
            try {
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                
                console.log('Testing login with:', { email, password: '[HIDDEN]' });
                const response = await ClientAccountsAPI.login(email, password);
                console.log('Login response:', response);
                
                showResult('login-result', `Login successful! Token: ${response.data?.token ? 'YES' : 'NO'}`, true);
            } catch (error) {
                console.error('Login error:', error);
                showResult('login-result', `Login failed: ${error.message}`, false);
            }
        }
        
        function checkAuthStatus() {
            const isLoggedIn = ClientAuth.isLoggedIn();
            const clientData = ClientAuth.getClientData();
            
            const message = `
                <strong>Logged In:</strong> ${isLoggedIn}<br>
                <strong>Client ID:</strong> ${clientData.id || 'N/A'}<br>
                <strong>Email:</strong> ${clientData.email || 'N/A'}<br>
                <strong>Name:</strong> ${clientData.name || 'N/A'}<br>
                <strong>Token:</strong> ${localStorage.getItem('token') ? 'Present' : 'Missing'}
            `;
            
            showResult('auth-result', message, isLoggedIn);
        }
        
        function testLogout() {
            try {
                ClientAuth.logout();
                showResult('logout-result', 'Logout successful! (Should redirect to login)', true);
            } catch (error) {
                showResult('logout-result', `Logout failed: ${error.message}`, false);
            }
        }
        
        // Check initial auth status
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
        });
    </script>
</body>
</html>
