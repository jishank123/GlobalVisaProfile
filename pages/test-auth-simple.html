<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 200px; display: block; }
    </style>
</head>
<body>
    <h1>Simple Authentication Test</h1>
    
    <div class="section">
        <h2>Test Login</h2>
        <input type="email" id="email" placeholder="Email" value="testnew@example.com">
        <input type="password" id="password" placeholder="Password" value="TestPass123">
        <button onclick="testLogin()">Login</button>
        <div id="result" class="result"></div>
    </div>
    
    <div class="section">
        <h2>Auth Status</h2>
        <button onclick="checkStatus()">Check Status</button>
        <div id="status" class="result"></div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    
    <script>
        function log(message) {
            console.log(message);
            document.getElementById('result').innerHTML += message + '<br>';
        }
        
        async function testLogin() {
            document.getElementById('result').innerHTML = '';
            
            try {
                log('🔐 Starting login test...');
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                log(`📧 Email: ${email}`);
                log(`🔑 Password: ${password ? '[PROVIDED]' : '[MISSING]'}`);
                
                // Check if API is available
                if (typeof ClientAccountsAPI === 'undefined') {
                    log('❌ ClientAccountsAPI not available');
                    return;
                }
                
                log('✅ ClientAccountsAPI available');
                
                // Make login call
                log('🌐 Making login API call...');
                const response = await ClientAccountsAPI.login(email, password);
                
                log('📨 Response received:');
                log(`- Success: ${response.success}`);
                log(`- Has token: ${response.data?.token ? 'YES' : 'NO'}`);
                log(`- Has client: ${response.data?.client ? 'YES' : 'NO'}`);
                
                if (response.success) {
                    log('✅ Login successful!');
                    
                    // Check localStorage
                    setTimeout(() => {
                        log('💾 Checking localStorage...');
                        log(`- Token: ${localStorage.getItem('token') ? 'PRESENT' : 'MISSING'}`);
                        log(`- Client ID: ${localStorage.getItem('clientId') || 'MISSING'}`);
                        log(`- Client Email: ${localStorage.getItem('clientEmail') || 'MISSING'}`);
                        log(`- Client Name: ${localStorage.getItem('clientName') || 'MISSING'}`);
                    }, 100);
                } else {
                    log(`❌ Login failed: ${response.error?.message || 'Unknown error'}`);
                }
                
            } catch (error) {
                log(`💥 Exception: ${error.message}`);
                console.error('Full error:', error);
            }
        }
        
        function checkStatus() {
            const status = document.getElementById('status');
            status.innerHTML = '';
            
            try {
                const isLoggedIn = ClientAuth.isLoggedIn();
                const clientData = ClientAuth.getClientData();
                
                status.innerHTML = `
                    <strong>Logged In:</strong> ${isLoggedIn}<br>
                    <strong>Client ID:</strong> ${clientData.id || 'N/A'}<br>
                    <strong>Email:</strong> ${clientData.email || 'N/A'}<br>
                    <strong>Name:</strong> ${clientData.name || 'N/A'}<br>
                    <strong>Token:</strong> ${localStorage.getItem('token') ? 'Present' : 'Missing'}
                `;
                
                status.className = `result ${isLoggedIn ? 'success' : 'error'}`;
            } catch (error) {
                status.innerHTML = `Error: ${error.message}`;
                status.className = 'result error';
            }
        }
        
        // Initial status check
        document.addEventListener('DOMContentLoaded', function() {
            checkStatus();
        });
    </script>
</body>
</html>
