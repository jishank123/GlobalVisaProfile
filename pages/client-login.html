<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login - ImmigrationPro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#2563eb',
                        'secondary': '#1e40af',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen">
    
    <!-- Navigation -->
    <nav class="bg-white/95 backdrop-blur-sm shadow-sm">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="index.html" class="flex items-center space-x-2">
                    <i class="fas fa-globe-americas text-3xl text-primary"></i>
                    <span class="text-2xl font-bold text-gray-800">ImmigrationPro</span>
                </a>
                <div class="flex items-center space-x-4">
                    <a href="client-signup.html" class="text-gray-700 hover:text-primary transition-colors">
                        Don't have an account? <strong>Sign Up</strong>
                    </a>
                    <a href="index.html" class="text-gray-600 hover:text-primary">
                        <i class="fas fa-home"></i> Home
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="py-12 md:py-20">
        <div class="container mx-auto px-4">
            <div class="max-w-md mx-auto">
                
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="inline-block bg-blue-100 text-primary px-4 py-2 rounded-full text-sm font-semibold mb-4">
                        CLIENT PORTAL
                    </div>
                    <h1 class="text-4xl font-bold text-gray-900 mb-4">Welcome Back</h1>
                    <p class="text-gray-600">
                        Log in to access your dashboard and track your progress
                    </p>
                </div>

                <!-- Login Form -->
                <div class="bg-white rounded-2xl shadow-xl p-8">
                    <form id="login-form" class="space-y-6">
                        
                        <!-- Email -->
                        <div>
                            <label class="block text-gray-700 font-semibold mb-2" for="email">
                                Email Address
                            </label>
                            <input type="email" id="email" name="email" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                   placeholder="john@example.com">
                        </div>

                        <!-- Password -->
                        <div>
                            <label class="block text-gray-700 font-semibold mb-2" for="password">
                                Password
                            </label>
                            <div class="relative">
                                <input type="password" id="password" name="password" required
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                       placeholder="Enter your password">
                                <button type="button" onclick="togglePassword()" 
                                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700">
                                    <i class="fas fa-eye" id="password-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Remember Me & Forgot Password -->
                        <div class="flex items-center justify-between">
                            <label class="flex items-center">
                                <input type="checkbox" id="remember" name="remember"
                                       class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-2 focus:ring-primary">
                                <span class="ml-2 text-sm text-gray-700">Remember me</span>
                            </label>
                            <a href="#" class="text-sm text-primary hover:underline">Forgot password?</a>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" 
                                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-4 rounded-xl text-lg font-bold hover:from-blue-700 hover:to-purple-700 transition-all transform hover:scale-105 shadow-lg">
                            <i class="fas fa-sign-in-alt mr-2"></i>
                            Log In
                        </button>

                        <!-- Message -->
                        <div id="login-message" class="hidden mt-4 p-4 rounded-lg"></div>
                    </form>

                    <!-- Sign Up Link -->
                    <div class="mt-6 text-center text-gray-600">
                        Don't have an account? 
                        <a href="client-signup.html" class="text-primary font-semibold hover:underline">Sign Up</a>
                    </div>
                </div>

                <!-- Quick Links -->
                <div class="mt-8 bg-white rounded-xl shadow-lg p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4">Need Help?</h3>
                    <ul class="space-y-3">
                        <li>
                            <a href="profile-assessment.html" class="flex items-center text-gray-700 hover:text-primary transition-colors">
                                <i class="fas fa-clipboard-check text-blue-600 mr-3"></i>
                                <span>Take Free Profile Assessment</span>
                            </a>
                        </li>
                        <li>
                            <a href="schedule-appointment.html" class="flex items-center text-gray-700 hover:text-primary transition-colors">
                                <i class="fas fa-calendar text-green-600 mr-3"></i>
                                <span>Schedule Consultation</span>
                            </a>
                        </li>
                        <li>
                            <a href="index.html#contact" class="flex items-center text-gray-700 hover:text-primary transition-colors">
                                <i class="fas fa-envelope text-purple-600 mr-3"></i>
                                <span>Contact Support</span>
                            </a>
                        </li>
                    </ul>
                </div>

            </div>
        </div>
    </section>

    <!-- JavaScript -->
    <script src="js/api.js"></script>
    <script>
        // Toggle password visibility
        function togglePassword() {
            const field = document.getElementById('password');
            const eye = document.getElementById('password-eye');
            
            if (field.type === 'password') {
                field.type = 'text';
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            }
        }

        // Simple password hashing (match signup)
        async function simpleHash(str) {
            const msgUint8 = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // Form submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageDiv = document.getElementById('login-message');
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // Validation
            if (!email || !password) {
                showMessage('Please enter email and password', 'error');
                return;
            }
            
            // Show loading
            showMessage('Logging in...', 'loading');
            
            try {
                // Login using API
                const result = await ClientAccountsAPI.login(email, password);
                
                if (result.success) {
                    console.log('Login successful:', result);
                    
                    // Store additional session data if remember is checked
                    if (remember) {
                        localStorage.setItem('rememberClient', 'true');
                    }
                    
                    showMessage('Login successful! Redirecting to your dashboard...', 'success');
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'client-dashboard.html';
                    }, 1500);
                } else {
                    throw new Error(result.error?.message || 'Login failed');
                }
                
            } catch (error) {
                console.error('Error logging in:', error);
                showMessage(error.message || 'Error logging in. Please try again.', 'error');
            }
        });
                    window.location.href = 'client-dashboard.html';
                }, 1500);
                
            } catch (error) {
                console.error('Error logging in:', error);
                showMessage('Error logging in. Please try again.', 'error');
            }
        });
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('login-message');
            messageDiv.classList.remove('hidden');
            
            if (type === 'error') {
                messageDiv.className = 'mt-4 p-4 rounded-lg bg-red-50 text-red-700 border border-red-200';
                messageDiv.innerHTML = `<i class="fas fa-exclamation-circle mr-2"></i>${message}`;
            } else if (type === 'success') {
                messageDiv.className = 'mt-4 p-4 rounded-lg bg-green-50 text-green-700 border border-green-200';
                messageDiv.innerHTML = `<i class="fas fa-check-circle mr-2"></i>${message}`;
            } else if (type === 'loading') {
                messageDiv.className = 'mt-4 p-4 rounded-lg bg-blue-50 text-blue-700 border border-blue-200';
                messageDiv.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>${message}`;
            }
        }

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', function() {
            const clientId = sessionStorage.getItem('clientId') || localStorage.getItem('clientId');
            if (clientId) {
                window.location.href = 'client-dashboard.html';
            }
        });
    </script>
</body>
</html>
