<!DOCTYPE html>
<html>
<head>
    <title>Create Account Managers</title>
    <script>
        // Simple password hashing function (SHA-256)
        async function simpleHash(str) {
            const msgUint8 = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // Create default account managers
        async function createDefaultManagers() {
            console.log('Creating default account managers...');
            
            const managers = [
                {
                    full_name: 'Sandeep Kumar',
                    email: 'sandeep@immigrationpro.com',
                    password: 'sandeep123',
                    phone: '(555) 100-0001',
                    role: 'Senior Account Manager'
                },
                {
                    full_name: 'Preet Singh',
                    email: 'preet@immigrationpro.com',
                    password: 'preet123',
                    phone: '(555) 100-0002',
                    role: 'Account Manager'
                },
                {
                    full_name: 'Deepali Sharma',
                    email: 'deepali@immigrationpro.com',
                    password: 'deepali123',
                    phone: '(555) 100-0003',
                    role: 'Account Manager'
                }
            ];
            
            for (const manager of managers) {
                const passwordHash = await simpleHash(manager.password);
                
                const managerData = {
                    email: manager.email,
                    password_hash: passwordHash,
                    full_name: manager.full_name,
                    phone: manager.phone,
                    status: 'active',
                    created_date: new Date().toISOString(),
                    last_login: new Date().toISOString(),
                    role: manager.role
                };
                
                try {
                    const response = await fetch('tables/account_managers', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(managerData)
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        console.log(`✅ Created: ${manager.full_name} (${manager.email})`);
                        console.log(`   Password: ${manager.password}`);
                        console.log(`   ID: ${result.id}`);
                    } else {
                        console.error(`❌ Failed to create: ${manager.full_name}`);
                    }
                } catch (error) {
                    console.error(`❌ Error creating ${manager.full_name}:`, error);
                }
            }
            
            console.log('\n✅ Setup complete! Account managers created.');
            console.log('\nLogin credentials:');
            console.log('1. Sandeep Kumar: sandeep@immigrationpro.com / sandeep123');
            console.log('2. Preet Singh: preet@immigrationpro.com / preet123');
            console.log('3. Deepali Sharma: deepali@immigrationpro.com / deepali123');
        }

        // Run on page load
        window.addEventListener('DOMContentLoaded', createDefaultManagers);
    </script>
</head>
<body>
    <h1>Creating Account Managers...</h1>
    <p>Check browser console for results.</p>
    <p>After creation, delete this file for security.</p>
</body>
</html>
