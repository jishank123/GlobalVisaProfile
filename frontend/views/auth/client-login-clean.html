<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login - ImmigrationPro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#667eea',
                        secondary: '#764ba2'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen">
    
    <!-- Navigation Placeholder -->
    <div id="navigation-placeholder"></div>

    <!-- Main Content -->
    <main class="pt-24 pb-16">
        <div class="container mx-auto px-4">
            <div class="max-w-md mx-auto">
                
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-600 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-sign-in-alt text-white text-2xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
                    <p class="text-gray-600">Sign in to access your client dashboard</p>
                </div>

                <!-- Login Form -->
                <div class="bg-white rounded-2xl shadow-xl p-8">
                    
                    <form id="login-form" class="space-y-6">
                        
                        <!-- CSRF Protection -->
                        <input type="hidden" name="_csrf" id="csrf-token" value="">
                        
                        <!-- Email -->
                        <div>
                            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                                Email Address <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email"
                                required
                                maxlength="255"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                                placeholder="your.email@example.com"
                            >
                        </div>

                        <!-- Password -->
                        <div>
                            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                                Password <span class="text-red-500">*</span>
                            </label>
                            <div class="relative">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password"
                                    required
                                    class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                                    placeholder="Enter your password"
                                >
                                <button 
                                    type="button" 
                                    onclick="togglePassword('password')"
                                    class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                                >
                                    <i class="fas fa-eye" id="password-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Remember Me & Forgot Password -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <input 
                                    type="checkbox" 
                                    id="remember" 
                                    name="remember"
                                    class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary"
                                >
                                <label for="remember" class="ml-2 text-sm text-gray-700">
                                    Remember me
                                </label>
                            </div>
                            <a href="#" class="text-sm text-primary hover:underline">
                                Forgot password?
                            </a>
                        </div>

                        <!-- Submit Button -->
                        <button 
                            type="submit" 
                            id="login-submit-btn"
                            class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 px-6 rounded-lg font-semibold hover:from-blue-700 hover:to-purple-700 transition-all transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
                        >
                            <i class="fas fa-sign-in-alt mr-2"></i>Sign In
                        </button>

                        <!-- Message Display -->
                        <div id="login-message" class="hidden"></div>
                    </form>

                    <!-- Signup Link -->
                    <div class="mt-6 text-center">
                        <p class="text-gray-600">
                            Don't have an account? 
                            <a href="/signup" class="text-primary hover:underline font-semibold">Create one here</a>
                        </p>
                    </div>
                </div>

                <!-- Quick Access -->
                <div class="mt-8 bg-white rounded-xl shadow-lg p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 text-center">
                        <i class="fas fa-rocket text-blue-600 mr-2"></i>Quick Access
                    </h3>
                    <div class="grid grid-cols-2 gap-4">
                        <a href="/assessment" class="text-center p-3 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors">
                            <i class="fas fa-chart-line text-blue-600 text-xl mb-2"></i>
                            <p class="text-sm font-medium text-gray-700">Free Assessment</p>
                        </a>
                        <a href="/schedule" class="text-center p-3 bg-purple-50 rounded-lg hover:bg-purple-100 transition-colors">
                            <i class="fas fa-calendar-alt text-purple-600 text-xl mb-2"></i>
                            <p class="text-sm font-medium text-gray-700">Schedule Call</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/footer.js"></script>
    
    <script>
        // Password visibility toggle
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const eye = document.getElementById(fieldId + '-eye');
            
            if (field.type === 'password') {
                field.type = 'text';
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            }
        }

        // Form validation rules
        const validationRules = {
            email: {
                required: true,
                pattern: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
                patternMessage: 'Please enter a valid email address',
                label: 'Email'
            },
            password: {
                required: true,
                label: 'Password'
            }
        };

        // Form submission handler
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 DOM loaded, initializing login form...');
            
            // Check if user is already logged in
            console.log('🔍 Checking if user is already logged in...');
            if (typeof ClientAuth !== 'undefined') {
                const isLoggedIn = ClientAuth.isLoggedIn();
                console.log('🔍 Already logged in:', isLoggedIn);
                if (isLoggedIn) {
                    console.log('🔄 User already logged in, redirecting to dashboard...');
                    window.location.href = '/dashboard';
                    return;
                }
            } else {
                console.warn('⚠️ ClientAuth not available, cannot check login status');
            }
            
            // Attach form submission handler
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                console.log('✅ Login form found, attaching event listener');
                
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    console.log('🔐 LOGIN ATTEMPT STARTED');
                    
                    try {
                        // Check if required objects are available
                        if (typeof formHandler === 'undefined') {
                            console.error('❌ formHandler not available');
                            alert('Error: Required scripts not loaded. Please refresh the page.');
                            return;
                        }
                        
                        if (typeof ClientAccountsAPI === 'undefined') {
                            console.error('❌ ClientAccountsAPI not available');
                            alert('Error: API scripts not loaded. Please refresh the page.');
                            return;
                        }
                        
                        // Extract form data
                        const formData = formHandler.extractFormData('login-form');
                        console.log('📊 Form data extracted:', { 
                            email: formData.email, 
                            password: formData.password ? '[PROVIDED]' : '[MISSING]'
                        });
                        
                        // Validate form
                        const errors = formHandler.validateForm(formData, validationRules);
                        if (errors.length > 0) {
                            formHandler.showError('login-message', errors.join('<br>'), true);
                            return;
                        }
                        
                        // Show loading
                        formHandler.showLoading('login-form', 'login-message', 'Signing you in...');
                        
                        // Make API call
                        console.log('🌐 Making API call to login...');
                        const response = await ClientAccountsAPI.login(formData.email, formData.password);
                        console.log('🌐 API response:', response);
                        
                        // Process response
                        if (response && response.success) {
                            console.log('✅ Login successful!');
                            
                            // Get the redirect URL from backend response
                            const redirectUrl = response.data?.redirectTo || '/client-profile';
                            const userRole = response.data?.client?.role || 'client';
                            
                            console.log(`🔑 ${userRole} login detected, redirecting to: ${redirectUrl}`);
                            
                            // Show appropriate success message based on role
                            let successMessage = 'Login successful! Redirecting to your dashboard...';
                            switch (userRole) {
                                case 'admin':
                                    successMessage = 'Admin login successful! Redirecting to admin dashboard...';
                                    break;
                                case 'lead_manager':
                                    successMessage = 'Lead Manager login successful! Redirecting to your dashboard...';
                                    break;
                                case 'crm_manager':
                                    successMessage = 'CRM Manager login successful! Redirecting to your dashboard...';
                                    break;
                                case 'client':
                                    successMessage = 'Client login successful! Redirecting to your profile...';
                                    break;
                            }
                            
                            formHandler.showSuccess('login-message', successMessage);
                            
                            setTimeout(() => {
                                console.log(`🔄 Redirecting to: ${redirectUrl}`);
                                window.location.href = redirectUrl;
                            }, 1500);
                            
                        } else {
                            console.log('❌ Login failed');
                            let errorMessage = 'Login failed';
                            
                            if (response && response.error) {
                                errorMessage = response.error.message || 'Unknown error occurred';
                            }
                            
                            formHandler.showError('login-message', errorMessage);
                            formHandler.resetLoading('login-form');
                        }
                        
                    } catch (error) {
                        console.error('💥 Login error:', error);
                        formHandler.showError('login-message', 'An unexpected error occurred: ' + error.message);
                        formHandler.resetLoading('login-form');
                    }
                });
                
            } else {
                console.error('❌ Login form not found!');
            }
        });
    </script>
</body>
</html>
