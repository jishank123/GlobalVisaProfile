<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImmigrationPro - Expert Immigration Services</title>
    <meta name="description" content="Professional immigration services for EB-1A, EB-2 NIW, and O-1 visa applications. Get expert guidance and profile assessment.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/CRM/images/favicon.ico">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/CRM/css/style.css">
    <link rel="stylesheet" href="/CRM/css/dropdown-fix.css">
    
    <!-- External CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <!-- Base URL for routing -->
    <base href="/CRM/">
</head>
<body class="bg-gray-50 font-sans">
    <!-- Loading indicator -->
    <div id="loading-indicator" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-gray-600">Loading...</p>
        </div>
    </div>

    <!-- Main content container -->
    <div id="app-container" class="hidden">
        <!-- Content will be loaded here by JavaScript -->
    </div>

    <!-- JavaScript -->
    <script src="/CRM/js/utils.js"></script>
    <script src="/CRM/js/api.js"></script>
    <script src="/CRM/js/router.js"></script>
    <script src="/CRM/js/navigation.js"></script>
    <script src="/CRM/js/main.js"></script>
    <script src="/CRM/js/footer.js"></script>
    <script src="/CRM/js/flow-controller.js"></script>
    <script src="/CRM/js/dashboard-data.js"></script>

    <script>
        // SPA Router for shared hosting
        class SPARouter {
            constructor() {
                this.basePath = '/CRM';
                this.routes = {
                    '': 'views/pages/index.html',
                    'login': 'views/dashboard/login.html',
                    'signup': 'views/dashboard/register.html',
                    'client-profile': 'views/dashboard/3-client-profile.html',
                    'lead-manager': 'views/dashboard/1-lead-manager.html',
                    'crm-manager': 'views/dashboard/4-crm-manager.html',
                    'admin': 'views/dashboard/2-admin-dashboard.html',
                    'assessment': 'views/pages/profile-assessment.html',
                    'schedule': 'views/pages/schedule-appointment-clean.html',
                    'services': 'views/pages/services-detailed.html',
                    'eb1a': 'views/pages/eb1a-eligibility.html',
                    'eb2-niw': 'views/pages/eb2-niw.html',
                    'o1-visa': 'views/pages/o1-visa.html',
                    'profile-building': 'views/pages/profile-building.html',
                    'attorneys': 'views/pages/attorney-referrals.html',
                    'faq': 'views/pages/faq.html',
                    'pricing': 'views/pages/pricing.html'
                };
                this.init();
            }

            init() {
                this.loadCurrentRoute();
                window.addEventListener('popstate', () => this.loadCurrentRoute());
                
                // Handle navigation clicks
                document.addEventListener('click', (e) => {
                    const link = e.target.closest('a[href^="/CRM/"]');
                    if (link && !link.hasAttribute('target')) {
                        e.preventDefault();
                        const path = link.getAttribute('href').replace('/CRM/', '');
                        this.navigateTo(path);
                    }
                });
            }

            getCurrentRoute() {
                const path = window.location.pathname.replace(this.basePath, '').replace(/^\//, '');
                return path || '';
            }

            navigateTo(route) {
                const fullPath = `${this.basePath}/${route}`;
                history.pushState(null, '', fullPath);
                this.loadRoute(route);
            }

            async loadCurrentRoute() {
                const route = this.getCurrentRoute();
                await this.loadRoute(route);
            }

            async loadRoute(route) {
                // Handle legacy redirects
                const redirects = {
                    'dashboard': 'client-profile',
                    'client-dashboard': 'client-profile',
                    'admin-dashboard': 'admin',
                    'manager': 'lead-manager',
                    'crm': 'crm-manager'
                };

                if (redirects[route]) {
                    return this.navigateTo(redirects[route]);
                }

                const filePath = this.routes[route] || this.routes[''];
                
                try {
                    const response = await fetch(`${this.basePath}/${filePath}`);
                    if (response.ok) {
                        const html = await response.text();
                        document.getElementById('app-container').innerHTML = html;
                        
                        // Update page title
                        const titleMatch = html.match(/<title>(.*?)<\/title>/);
                        if (titleMatch) {
                            document.title = titleMatch[1];
                        }
                        
                        // Execute any scripts in the loaded content
                        this.executeScripts();
                        
                    } else {
                        throw new Error('Page not found');
                    }
                } catch (error) {
                    console.error('Error loading route:', error);
                    this.load404();
                }
                
                // Hide loading indicator and show content
                document.getElementById('loading-indicator').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
            }

            executeScripts() {
                const scripts = document.getElementById('app-container').querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.head.appendChild(newScript);
                });
            }

            load404() {
                document.getElementById('app-container').innerHTML = `
                    <div class="min-h-screen flex items-center justify-center px-4">
                        <div class="max-w-2xl w-full text-center">
                            <div class="bg-white rounded-2xl shadow-xl p-8">
                                <i class="fas fa-exclamation-triangle text-6xl text-yellow-500 mb-6"></i>
                                <h1 class="text-4xl font-bold text-gray-900 mb-4">404 - Page Not Found</h1>
                                <p class="text-xl text-gray-600 mb-8">The requested page could not be found.</p>
                                <a href="/CRM/" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 transition-colors">
                                    <i class="fas fa-home mr-2"></i>Go to Homepage
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize SPA router when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            window.spaRouter = new SPARouter();
        });
    </script>
</body>
</html>
