<!DOCTYPE html>

    <head>

        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml"/>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='%232563eb'><rect width='32' height='32' rx='6' fill='%232563eb'/><path d='M8 24V12h3v12H8zm5-12h3v12h-3V12zm5 0h3v12h-3V12zm5 0h3v12h-3V12z' fill='white'/><rect x='6' y='10' width='20' height='2' fill='white'/><rect x='6' y='24' width='20' height='2' fill='white'/></svg>"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>

        <meta

        http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: http://localhost:5000 https://backend.immigrationprofile.com https:; connect-src 'self' http://localhost:5000 https://backend.immigrationprofile.com https:;">

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Google Fonts -->
        <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

        <!-- Font Awesome -->
        <link
        rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">

        <!-- Bootstrap 5.3.0 for dashboard components -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <title>ImmigrationPro - Expert Visa & Green Card Solutions | EB-1, EB-2 NIW, O-1</title>

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            'sans': ['Inter', 'sans-serif']
                        },
                        colors: {
                            'primary': '#2563eb',
                            'secondary': '#1e40af',
                            'accent': '#3b82f6'
                        }
                    }
                }
            }
        </script>
    </head>
    <body class="font-sans antialiased">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
